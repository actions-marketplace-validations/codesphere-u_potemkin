[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "potemkin-audit"
version = "1.1.0"
description = "Deterministic Agent Skill & CLI that exposes Potemkin stubs, fake fallbacks, dead full-stack wires, secret fallbacks, and AI reward hacking."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "codesphere-u" }]
keywords = [
  "ai-agents",
  "agent-skills",
  "static-analysis",
  "verification",
  "full-stack",
  "code-review",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://codesphere-u.github.io/potemkin/"
Website = "https://codesphere-u.github.io/potemkin/"
Documentation = "https://codesphere-u.github.io/potemkin/docs"
Repository = "https://github.com/codesphere-u/potemkin"
Issues = "https://github.com/codesphere-u/potemkin/issues"

[project.scripts]
potemkin = "potemkin:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[tool.setuptools]
py-modules = ["potemkin"]

[tool.setuptools.package-dir]
"" = "skills/potemkin/scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
files = ["skills/potemkin/scripts/potemkin.py"]
